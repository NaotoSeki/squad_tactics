<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PS 配置文法 ブラインド評価</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
      background: #141713;
      color: #e9ede3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 18px;
      background: #1c211b;
      border-bottom: 1px solid #384035;
    }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 0; color: #adb7a6; font-size: 13px; }
    button {
      color: #e9ede3;
      background: #293126;
      border: 1px solid #4a5844;
      border-radius: 4px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button:hover, button.active { background: #536246; }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      min-height: calc(100vh - 67px);
    }
    .viewer { padding: 16px; min-width: 0; }
    .scene-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: #252b22;
      border: 1px solid #4a5544;
    }
    .frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      image-rendering: auto;
    }
    .blind-label {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 6px 9px;
      background: rgba(0, 0, 0, .72);
      font-size: 13px;
    }
    aside {
      padding: 16px;
      background: #1a1f19;
      border-left: 1px solid #384035;
    }
    aside h2 { margin: 0 0 12px; font-size: 16px; }
    fieldset {
      margin: 0 0 16px;
      border: 1px solid #414b3d;
      padding: 10px;
    }
    legend { color: #cbd3c4; }
    .scale {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    .scale label {
      display: grid;
      place-items: center;
      min-height: 34px;
      border: 1px solid #414b3d;
      cursor: pointer;
    }
    .scale input { margin: 0 0 3px; }
    .tags { display: grid; gap: 7px; }
    textarea {
      width: 100%;
      min-height: 76px;
      resize: vertical;
      color: #eef1e8;
      background: #10130f;
      border: 1px solid #465140;
      padding: 8px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .status { min-height: 18px; color: #aebaa5; font-size: 12px; }
    .answer {
      margin-top: 12px;
      padding: 9px;
      background: #111510;
      border: 1px solid #404a3c;
      color: #bdc9b6;
      font-size: 13px;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside { border-left: 0; border-top: 1px solid #384035; }
    }
  </style>
</head>
<body>
  <header>
    <h1>PS 配置文法 ブラインド評価</h1>
    <p>全画像は同じ復元レンダー。実マップ配置と新規組み替えを伏せて比較します。入力内容は自動保存されます。</p>
  </header>
  <main>
    <section class="viewer">
      <nav class="scene-tabs" id="tabs"></nav>
      <div class="frame">
        <img id="scene" alt="評価対象の戦場シーン">
        <div class="blind-label" id="blindLabel"></div>
      </div>
    </section>
    <aside>
      <h2 id="formTitle">Scene 1 の評価</h2>
      <fieldset>
        <legend>PSらしさ</legend>
        <div class="scale" id="likeness"></div>
      </fieldset>
      <fieldset>
        <legend>情景の自然さ</legend>
        <div class="scale" id="naturalness"></div>
      </fieldset>
      <fieldset>
        <legend>気になった箇所</legend>
        <div class="tags" id="tags"></div>
      </fieldset>
      <label for="note">短いメモ</label>
      <textarea id="note" placeholder="例: 教会の右奥で屋根が重なって見える"></textarea>
      <div class="actions">
        <button id="save">今すぐ保存</button>
        <button id="reveal">答えを表示</button>
        <button id="export">評価JSONを書き出す</button>
      </div>
      <p class="status" id="status"></p>
      <div class="answer" id="answer" hidden></div>
    </aside>
  </main>
  <script>
    const scenes = [
      {
        id: "scene-1",
        src: "scratch/ps_native_state_compare/demo_campaign_battle_01_iso_x11440_y6960_native.png",
        answer: "PS実マップ配置の復元レンダー：南部集落（実ゲーム画面そのものではありません）"
      },
      {
        id: "scene-2",
        src: "scratch/ps_seed_maps/ps_cluster_seed_20260725_r180_g360_v2_native.png",
        answer: "生成 v2：cluster seed 20260725 / core 180 / ground 360"
      },
      {
        id: "scene-3",
        src: "scratch/ps_native_state_compare/demo_campaign_battle_01_iso_x12800_y3000_native.png",
        answer: "PS実マップ配置の復元レンダー：北部集落（実ゲーム画面そのものではありません）"
      },
      {
        id: "scene-4",
        src: "scratch/ps_seed_maps/ps_cluster_seed_20260724_r180_g360_v2_native.png",
        answer: "生成 v2：cluster seed 20260724 / core 180 / ground 360"
      },
      {
        id: "scene-5",
        src: "scratch/ps_seed_maps/ps_cluster_seed_20260726_r180_g360_v2_native.png",
        answer: "生成 v2：cluster seed 20260726 / core 180 / ground 360"
      }
    ];
    const tagNames = [
      "道路の連続",
      "建物の重なり",
      "柵の連続",
      "植生の量塊",
      "塩コショウ状の植生",
      "地表の空白",
      "明暗・影",
      "違和感なし"
    ];
    const storageKey = "ps-cluster-seed-blind-review-v2";
    let active = 0;
    let revealed = false;
    let reviews = JSON.parse(localStorage.getItem(storageKey) || "{}");
    let noteSaveTimer = 0;

    function scaleHtml(name) {
      return [1, 2, 3, 4, 5].map(value =>
        `<label><input type="radio" name="${name}" value="${value}">${value}</label>`
      ).join("");
    }
    likeness.innerHTML = scaleHtml("likeness");
    naturalness.innerHTML = scaleHtml("naturalness");
    tags.innerHTML = tagNames.map((name, index) =>
      `<label><input type="checkbox" value="${index}"> ${name}</label>`
    ).join("");

    function currentReview() {
      return reviews[scenes[active].id] || {};
    }
    function renderTabs() {
      tabs.innerHTML = scenes.map((item, index) =>
        `<button class="${index === active ? "active" : ""}" data-index="${index}">Scene ${index + 1}</button>`
      ).join("");
      tabs.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          persistCurrent("自動保存しました");
          active = Number(button.dataset.index);
          revealed = false;
          render();
        });
      });
    }
    function loadForm() {
      const review = currentReview();
      document.querySelectorAll("input[type=radio]").forEach(input => {
        input.checked = Number(input.value) === Number(review[input.name]);
      });
      document.querySelectorAll("#tags input").forEach(input => {
        input.checked = (review.tags || []).includes(Number(input.value));
      });
      note.value = review.note || "";
    }
    function render() {
      const item = scenes[active];
      scene.src = item.src;
      blindLabel.textContent = `Scene ${active + 1}`;
      formTitle.textContent = `Scene ${active + 1} の評価`;
      answer.hidden = !revealed;
      answer.textContent = item.answer;
      status.textContent = currentReview().savedAt ? "保存済み" : "";
      renderTabs();
      loadForm();
    }
    function selectedRadio(name) {
      return Number(document.querySelector(`input[name=${name}]:checked`)?.value || 0);
    }
    function formHasInput() {
      return selectedRadio("likeness") > 0
        || selectedRadio("naturalness") > 0
        || document.querySelectorAll("#tags input:checked").length > 0
        || note.value.trim().length > 0;
    }
    function persistCurrent(message = "自動保存しました") {
      if (!formHasInput()) {
        return;
      }
      reviews[scenes[active].id] = {
        likeness: selectedRadio("likeness"),
        naturalness: selectedRadio("naturalness"),
        tags: [...document.querySelectorAll("#tags input:checked")].map(input => Number(input.value)),
        tagLabels: [...document.querySelectorAll("#tags input:checked")].map(input => tagNames[Number(input.value)]),
        note: note.value.trim(),
        savedAt: new Date().toISOString()
      };
      localStorage.setItem(storageKey, JSON.stringify(reviews));
      status.textContent = message;
    }
    document.querySelectorAll("input[type=radio], #tags input").forEach(input => {
      input.addEventListener("change", () => persistCurrent());
    });
    note.addEventListener("input", () => {
      window.clearTimeout(noteSaveTimer);
      noteSaveTimer = window.setTimeout(() => persistCurrent(), 250);
    });
    save.addEventListener("click", () => {
      persistCurrent("保存しました");
    });
    reveal.addEventListener("click", () => {
      revealed = !revealed;
      answer.hidden = !revealed;
      answer.textContent = scenes[active].answer;
    });
    document.getElementById("export").onclick = () => {
      persistCurrent("保存してJSONを書き出しました");
      const payload = {
        schema: "ps-visual-reward-v2",
        createdAt: new Date().toISOString(),
        reviews
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "ps_cluster_seed_review.json";
      link.click();
      URL.revokeObjectURL(link.href);
    };
    render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WW2 Hex City V6 (The True V2 Successor)</title>
    <style>
        body {
            background-color: #2c2f33;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #1a1c1e;
            border: 1px solid #555;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            margin-top: 10px;
            image-rendering: pixelated;
        }
        #controls {
            margin-bottom: 20px;
        }
        button {
            background-color: #7289da;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover { background-color: #5b6eae; }
    </style>
</head>
<body>
    <h1>WW2 荒廃都市 V6 (V2コアの完全復刻と洗練)</h1>
    <div id="controls">
        <button onclick="generateMap()">マップを再生成 (Regenerate City Block)</button>
    </div>
    <canvas id="gameCanvas" width="1200" height="800"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // The Sacred V2 Isometric Grid Math
        const TILE_W = 128; 
        const TILE_H = 74;  
        const TILE_Z = 64;  
        const OFFSET_X = 600; 
        const OFFSET_Y = 150;

        // Image sets
        const images = {
            base_ground: [],
            wall_level1: [],
            wall_level2: [],
            chimney: []
        };
        let loadedCount = 0;
        let totalCount = 32;

        function loadImage(src, category) {
            const img = new Image();
            img.src = src;
            img.onload = () => {
                loadedCount++;
                if(loadedCount === totalCount) generateMap();
            };
            img.onerror = () => {
                console.warn("Failed to load: " + src);
                loadedCount++;
                if(loadedCount === totalCount) generateMap();
            }
            images[category].push(img);
        }

        for(let i=0; i<8; i++) {
            loadImage(`base_ground_v${i}.png`, 'base_ground');
            loadImage(`wall_level1_v${i}.png`, 'wall_level1');
            loadImage(`wall_level2_v${i}.png`, 'wall_level2');
            loadImage(`chimney_v${i}.png`, 'chimney');
        }

        function drawTile(img, sx, sy) {
            if(!img || !img.complete || img.naturalWidth === 0) return;
            const scale = 0.5;
            const drawW = 512 * scale;
            const drawH = 512 * scale;
            // Align bottom center
            const dx = sx - drawW / 2;
            const dy = sy - drawH * 0.7;
            ctx.drawImage(img, dx, dy, drawW, drawH);
        }

        function generateMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const mapW = 10;
            const mapH = 10;
            let tiles = [];
            
            for(let q=0; q<mapW; q++) {
                for(let r=0; r<mapH; r++) {
                    // Create an organic diagonal road
                    // Math.abs(q - r) makes a straight diagonal. We add noise.
                    let roadNoise = Math.sin(r * 1.5) * 1.5;
                    let distToRoad = Math.abs((q + roadNoise) - 5);
                    
                    tiles.push({
                        q: q, 
                        r: r, 
                        dist: distToRoad
                    });
                }
            }

            // Painter's Algorithm for V2 Square Isometric Grid
            tiles.sort((a,b) => {
                return (a.q + a.r) - (b.q + b.r);
            });

            for(let t of tiles) {
                // The Sacred V2 Pixel Coordinates
                let sx = OFFSET_X + (t.q - t.r) * (TILE_W / 2);
                let sy = OFFSET_Y + (t.q + t.r) * (TILE_H / 2);

                // Always draw base
                let groundImg = images.base_ground[Math.floor(Math.random() * images.base_ground.length)];
                drawTile(groundImg, sx, sy);

                // If it's the road (dist < 1.5), don't build. Else build up!
                if (t.dist > 1.5) {
                    let buildProb1 = t.dist >= 2 ? 0.95 : 0.6; 
                    let buildProb2 = t.dist >= 3 ? 0.8 : 0.2;
                    let buildProb3 = t.dist >= 4 ? 0.5 : 0.05;

                    // Level 1
                    if (Math.random() < buildProb1) {
                        let wall1Img = images.wall_level1[Math.floor(Math.random() * images.wall_level1.length)];
                        drawTile(wall1Img, sx, sy);

                        // Level 2 Stacking
                        if (Math.random() < buildProb2) {
                            let wall2Img = images.wall_level2[Math.floor(Math.random() * images.wall_level2.length)];
                            drawTile(wall2Img, sx, sy - TILE_Z);

                            // Chimney Stacking
                            if (Math.random() < buildProb3) {
                                let chimneyImg = images.chimney[Math.floor(Math.random() * images.chimney.length)];
                                drawTile(chimneyImg, sx, sy - TILE_Z*2);
                            }
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>

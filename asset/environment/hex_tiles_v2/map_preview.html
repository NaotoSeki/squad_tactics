<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WW2 Hex City Vertical Map Preview</title>
    <style>
        body {
            background-color: #2c2f33;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #1a1c1e;
            border: 1px solid #555;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            margin-top: 10px;
            image-rendering: pixelated;
        }
        #controls {
            margin-bottom: 20px;
        }
        button {
            background-color: #7289da;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover { background-color: #5b6eae; }
    </style>
</head>
<body>
    <h1>WW2 荒廃都市 垂直生成プレビュー</h1>
    <div id="controls">
        <button onclick="generateMap()">マップを再生成 (Regenerate Map)</button>
    </div>
    <canvas id="gameCanvas" width="1200" height="800"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Isometric mapping configuration
        const TILE_W = 128; // Screen width of a hex
        const TILE_H = 74;  // Screen height of a hex
        const TILE_Z = 64;  // Screen Y-offset per vertical level
        const OFFSET_X = 600; // Center offset
        const OFFSET_Y = 200;

        // Image sets
        const images = {
            base_ground: [],
            wall_level1: [],
            wall_level2: [],
            chimney: []
        };
        let loadedCount = 0;
        let totalCount = 16;

        function loadImage(src, category) {
            const img = new Image();
            img.src = src;
            img.onload = () => {
                loadedCount++;
                if(loadedCount === totalCount) {
                    generateMap();
                }
            };
            img.onerror = () => {
                console.warn("Failed to load: " + src);
                loadedCount++;
                if(loadedCount === totalCount) generateMap();
            }
            images[category].push(img);
        }

        // Load v2 batch rendered tiles (4 variations each)
        for(let i=0; i<4; i++) {
            loadImage(`base_ground_v${i}.png`, 'base_ground');
            loadImage(`wall_level1_v${i}.png`, 'wall_level1');
            loadImage(`wall_level2_v${i}.png`, 'wall_level2');
            loadImage(`chimney_v${i}.png`, 'chimney');
        }

        function drawTile(img, sx, sy) {
            if(!img || !img.complete || img.naturalWidth === 0) return;
            // The Blender output is 512x512. We scale it down to fit our hex grid.
            // A 512x512 image's center should align with the hex center.
            const scale = 0.5;
            const drawW = 512 * scale;
            const drawH = 512 * scale;
            // Offset drawing so the object bottom aligns with the grid
            const dx = sx - drawW / 2;
            const dy = sy - drawH * 0.7; // Adjust based on camera angle
            ctx.drawImage(img, dx, dy, drawW, drawH);
        }

        function generateMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Map dimensions (grid)
            const mapW = 8;
            const mapH = 8;
            
            // Isometric depth sorting: sum of x+y coordinates
            let tiles = [];
            for(let x=0; x<mapW; x++) {
                for(let y=0; y<mapH; y++) {
                    tiles.push({x: x, y: y});
                }
            }
            tiles.sort((a,b) => (a.x + a.y) - (b.x + b.y));

            // Procedural Logic (Stacking)
            for(let t of tiles) {
                // Isometric conversion
                let sx = OFFSET_X + (t.x - t.y) * (TILE_W / 2);
                let sy = OFFSET_Y + (t.x + t.y) * (TILE_H / 2);

                // 1. Draw Ground Level (Level 0)
                let groundImg = images.base_ground[Math.floor(Math.random() * images.base_ground.length)];
                drawTile(groundImg, sx, sy);

                // 2. Chance to build a Ruined Wall (Level 1)
                if (Math.random() > 0.3) {
                    let wall1Img = images.wall_level1[Math.floor(Math.random() * images.wall_level1.length)];
                    drawTile(wall1Img, sx, sy); // Drawn exactly on top, image bounds should overlap correctly

                    // 3. Chance to build 2nd Floor (Level 2)
                    if (Math.random() > 0.4) {
                        let wall2Img = images.wall_level2[Math.floor(Math.random() * images.wall_level2.length)];
                        // We draw it at the SAME screen coordinate if the 3D model was designed to stack,
                        // OR we offset it by Z if the models are all ground-based.
                        // Assuming the script generated everything at (0,0,0), we offset Y.
                        drawTile(wall2Img, sx, sy - TILE_Z);

                        // 4. Chance for a chimney sticking out (Level 3)
                        if (Math.random() > 0.7) {
                            let chimneyImg = images.chimney[Math.floor(Math.random() * images.chimney.length)];
                            drawTile(chimneyImg, sx, sy - TILE_Z*2);
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WW2 Hex City V5 (The Ultimate Fusion)</title>
    <style>
        body {
            background-color: #2c2f33;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #1a1c1e;
            border: 1px solid #555;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            margin-top: 10px;
            image-rendering: pixelated;
        }
        #controls {
            margin-bottom: 20px;
        }
        button {
            background-color: #7289da;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover { background-color: #5b6eae; }
    </style>
</head>
<body>
    <h1>WW2 荒廃都市 最終系プレビュー (V2の積み上げ ＋ 有機的ヘックス道路)</h1>
    <div id="controls">
        <button onclick="generateMap()">マップを再生成 (Regenerate Ultimate Map)</button>
    </div>
    <canvas id="gameCanvas" width="1200" height="800"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Hex mapping configuration (Odd-Q)
        const TILE_W = 148; 
        const TILE_H = 86;  
        const TILE_Z = 64;  // V2 STACKING IS BACK!
        const OFFSET_X = 150; 
        const OFFSET_Y = 150;

        // Image sets
        const images = {
            base_ground: [],
            wall_level1: [],
            wall_level2: [],
            chimney: []
        };
        let loadedCount = 0;
        let totalCount = 32;

        function loadImage(src, category) {
            const img = new Image();
            img.src = src;
            img.onload = () => {
                loadedCount++;
                if(loadedCount === totalCount) generateMap();
            };
            img.onerror = () => {
                console.warn("Failed to load: " + src);
                loadedCount++;
                if(loadedCount === totalCount) generateMap();
            }
            images[category].push(img);
        }

        for(let i=0; i<8; i++) {
            loadImage(`base_ground_v${i}.png`, 'base_ground');
            loadImage(`wall_level1_v${i}.png`, 'wall_level1');
            loadImage(`wall_level2_v${i}.png`, 'wall_level2');
            loadImage(`chimney_v${i}.png`, 'chimney');
        }

        function drawTile(img, sx, sy) {
            if(!img || !img.complete || img.naturalWidth === 0) return;
            const scale = 0.5;
            const drawW = 512 * scale;
            const drawH = 512 * scale;
            const dx = sx - drawW / 2;
            const dy = sy - drawH * 0.7; // Adjusted to align bottom
            ctx.drawImage(img, dx, dy, drawW, drawH);
        }

        function getNeighbors(q, r) {
            const parity = q & 1;
            const dirs = [
                [+1, parity], [+1, parity - 1], [0, -1],
                [-1, parity - 1], [-1, parity], [0, +1]
            ];
            return dirs.map(d => ({q: q + d[0], r: r + d[1]}));
        }

        function generateMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const mapW = 9;
            const mapH = 9;
            
            let grid = {};
            let tiles = [];
            
            for(let q=0; q<mapW; q++) {
                for(let r=0; r<mapH; r++) {
                    const id = `${q},${r}`;
                    grid[id] = {q: q, r: r, distanceToRoad: 999};
                    tiles.push(grid[id]);
                }
            }

            // Generate Organic Road (Random Walk)
            let currentQ = 0;
            let currentR = Math.floor(mapH / 2);
            let roadPath = [];
            
            while(currentQ < mapW) {
                const id = `${currentQ},${currentR}`;
                if(grid[id]) {
                    grid[id].distanceToRoad = 0;
                    roadPath.push(grid[id]);
                }
                
                let neighbors = getNeighbors(currentQ, currentR);
                let validForward = neighbors.filter(n => n.q >= currentQ && n.r >= 1 && n.r < mapH-1);
                
                if(validForward.length > 0) {
                    let next = validForward[Math.floor(Math.random() * validForward.length)];
                    currentQ = next.q;
                    currentR = next.r;
                } else {
                    currentQ++; 
                }
            }

            let queue = [...roadPath];
            while(queue.length > 0) {
                let curr = queue.shift();
                let neighbors = getNeighbors(curr.q, curr.r);
                for(let n of neighbors) {
                    let nId = `${n.q},${n.r}`;
                    if(grid[nId] && grid[nId].distanceToRoad > curr.distanceToRoad + 1) {
                        grid[nId].distanceToRoad = curr.distanceToRoad + 1;
                        queue.push(grid[nId]);
                    }
                }
            }

            tiles.sort((a,b) => {
                let ya = a.r + (a.q % 2 === 1 ? 0.5 : 0);
                let yb = b.r + (b.q % 2 === 1 ? 0.5 : 0);
                if (ya === yb) return a.q - b.q;
                return ya - yb;
            });

            // Draw Tiles with V2 STACKING LOGIC
            for(let t of tiles) {
                let sx = OFFSET_X + t.q * TILE_W * 0.75;
                let sy = OFFSET_Y + t.r * TILE_H + (t.q % 2 === 1 ? TILE_H / 2 : 0);

                let dist = t.distanceToRoad;

                // 1. Draw Ground Level (Level 0) with new Mud textures
                let groundImg = images.base_ground[Math.floor(Math.random() * images.base_ground.length)];
                drawTile(groundImg, sx, sy);

                // If not road, build up!
                if (dist > 0) {
                    let buildProb1 = dist >= 1 ? 0.9 : 0; 
                    let buildProb2 = dist >= 2 ? 0.7 : 0.2;
                    let buildProb3 = dist >= 2 ? 0.5 : 0.05;

                    // Level 1
                    if (Math.random() < buildProb1) {
                        let wall1Img = images.wall_level1[Math.floor(Math.random() * images.wall_level1.length)];
                        drawTile(wall1Img, sx, sy);

                        // Level 2 (V2 Stacking!)
                        if (Math.random() < buildProb2) {
                            let wall2Img = images.wall_level2[Math.floor(Math.random() * images.wall_level2.length)];
                            drawTile(wall2Img, sx, sy - TILE_Z);

                            // Level 3 (Chimney)
                            if (Math.random() < buildProb3) {
                                let chimneyImg = images.chimney[Math.floor(Math.random() * images.chimney.length)];
                                drawTile(chimneyImg, sx, sy - TILE_Z*2);
                            }
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>

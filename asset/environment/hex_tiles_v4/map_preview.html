<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WW2 Hex City Organic Map Preview (v4)</title>
    <style>
        body {
            background-color: #2c2f33;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #1a1c1e;
            border: 1px solid #555;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            margin-top: 10px;
            image-rendering: pixelated;
        }
        #controls {
            margin-bottom: 20px;
        }
        button {
            background-color: #7289da;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover { background-color: #5b6eae; }
    </style>
</head>
<body>
    <h1>WW2 荒廃都市 有機的ヘックス生成プレビュー (V4: 史実特化の完全立体廃墟)</h1>
    <div id="controls">
        <button onclick="generateMap()">マップを再生成 (Regenerate Organic Map)</button>
    </div>
    <canvas id="gameCanvas" width="1200" height="800"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Hex mapping configuration (Odd-Q)
        const TILE_W = 148; 
        const TILE_H = 86;  
        const OFFSET_X = 150; 
        const OFFSET_Y = 150;

        // Image sets
        const images = {
            crater: [],
            fortress: [],
            ruin_facade: [],
            ruin_corner: []
        };
        let loadedCount = 0;
        let totalCount = 32;

        function loadImage(src, category) {
            const img = new Image();
            img.src = src;
            img.onload = () => {
                loadedCount++;
                if(loadedCount === totalCount) generateMap();
            };
            img.onerror = () => {
                console.warn("Failed to load: " + src);
                loadedCount++;
                if(loadedCount === totalCount) generateMap();
            }
            images[category].push(img);
        }

        // Load v4 batch rendered tiles (8 variations each)
        for(let i=0; i<8; i++) {
            loadImage(`crater_v${i}.png`, 'crater');
            loadImage(`fortress_v${i}.png`, 'fortress');
            loadImage(`ruin_facade_v${i}.png`, 'ruin_facade');
            loadImage(`ruin_corner_v${i}.png`, 'ruin_corner');
        }

        function drawTile(img, sx, sy) {
            if(!img || !img.complete || img.naturalWidth === 0) return;
            const scale = 0.5;
            const drawW = 512 * scale;
            const drawH = 512 * scale;
            const dx = sx - drawW / 2;
            const dy = sy - drawH * 0.75; // Adjusted since camera is zoomed out
            ctx.drawImage(img, dx, dy, drawW, drawH);
        }

        function getNeighbors(q, r) {
            const parity = q & 1;
            const dirs = [
                [+1, parity], [+1, parity - 1], [0, -1],
                [-1, parity - 1], [-1, parity], [0, +1]
            ];
            return dirs.map(d => ({q: q + d[0], r: r + d[1]}));
        }

        function generateMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const mapW = 9;
            const mapH = 9;
            
            let grid = {};
            let tiles = [];
            
            // Initialize Grid
            for(let q=0; q<mapW; q++) {
                for(let r=0; r<mapH; r++) {
                    const id = `${q},${r}`;
                    grid[id] = {q: q, r: r, distanceToRoad: 999};
                    tiles.push(grid[id]);
                }
            }

            // Generate Organic Road (Random Walk)
            let currentQ = 0;
            let currentR = Math.floor(mapH / 2);
            let roadPath = [];
            
            while(currentQ < mapW) {
                const id = `${currentQ},${currentR}`;
                if(grid[id]) {
                    grid[id].distanceToRoad = 0;
                    roadPath.push(grid[id]);
                }
                
                let neighbors = getNeighbors(currentQ, currentR);
                let validForward = neighbors.filter(n => n.q >= currentQ && n.r >= 1 && n.r < mapH-1);
                
                if(validForward.length > 0) {
                    let next = validForward[Math.floor(Math.random() * validForward.length)];
                    currentQ = next.q;
                    currentR = next.r;
                } else {
                    currentQ++; 
                }
            }

            // Calculate distance to road (BFS)
            let queue = [...roadPath];
            while(queue.length > 0) {
                let curr = queue.shift();
                let neighbors = getNeighbors(curr.q, curr.r);
                for(let n of neighbors) {
                    let nId = `${n.q},${n.r}`;
                    if(grid[nId] && grid[nId].distanceToRoad > curr.distanceToRoad + 1) {
                        grid[nId].distanceToRoad = curr.distanceToRoad + 1;
                        queue.push(grid[nId]);
                    }
                }
            }

            // Sort tiles for isometric rendering (painter's algorithm)
            tiles.sort((a,b) => {
                let ya = a.r + (a.q % 2 === 1 ? 0.5 : 0);
                let yb = b.r + (b.q % 2 === 1 ? 0.5 : 0);
                if (ya === yb) return a.q - b.q;
                return ya - yb;
            });

            // Draw Tiles
            for(let t of tiles) {
                let sx = OFFSET_X + t.q * TILE_W * 0.75;
                let sy = OFFSET_Y + t.r * TILE_H + (t.q % 2 === 1 ? TILE_H / 2 : 0);

                let dist = t.distanceToRoad;
                let img;

                // Pick complete building based on distance to the road
                if (dist === 0) {
                    // Roads are completely bombed out
                    img = images.crater[Math.floor(Math.random() * images.crater.length)];
                } else if (dist === 1) {
                    // Beside road: 50% fortress bunker, 50% tall facade
                    if (Math.random() > 0.5) {
                        img = images.fortress[Math.floor(Math.random() * images.fortress.length)];
                    } else {
                        img = images.ruin_facade[Math.floor(Math.random() * images.ruin_facade.length)];
                    }
                } else {
                    // Deep in the city block: massive corner ruins and facades
                    if (Math.random() > 0.5) {
                        img = images.ruin_corner[Math.floor(Math.random() * images.ruin_corner.length)];
                    } else {
                        img = images.ruin_facade[Math.floor(Math.random() * images.ruin_facade.length)];
                    }
                }

                drawTile(img, sx, sy);
            }
        }
    </script>
</body>
</html>
